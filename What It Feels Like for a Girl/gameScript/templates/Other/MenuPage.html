<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Page</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/desktop.css">
</head>

<body>
    <main class=" WIFLG">
        <section class="screen">
            <a href="/templates/Other/desktop.html">
                <button class="play clickable" style="position: absolute; z-index: 1;">PLAY</button>
            </a>
            <button class="settings clickable" style="position: absolute; z-index: 1;">SETTINGS</button>
            <button class="exit clickable" style="position: absolute; z-index: 1;">EXIT GAME</button>

            <!-- IMAGES -->
            <!-- left-corner -->
            <img src="/assets/images/story/glitter.png"
                style="height: 100vh;width: 600px; position: absolute; top: 0px; left: 0px;">
            <img src="/assets/images/story/sparkle.png" style="height:90vh;width: 550px;position: absolute;
            ">
            <!-- petals -->
            <img class="petal" src="/assets/images/story/petal1.png"
                style="position: absolute;height: 500px; width: 500px; top: -110px; right: -200px;">
            <img src="/assets/images/story/petal2.png" style="position: absolute;height: 400px;height:400px;
            top: -70px;left: 250px;">
            <img src="/assets/images/story/petal3.png"
                style="position: absolute;height: 155px;width: 155px;top: 70px;left: 370px;">
            <!-- bottom -->
            <img src=" /assets/images/story/flower.png"
                style="height: 50vh;width: 100vw;transform: translate(0%, 102.25%);">
            <img class="unicorn" src="/assets/images/story/unicorn.png"
                style="height: 65%;width: 30%;position:absolute;left:950px; top: 250px; rotate: 15deg;">
        </section>

        <!-- AUDIO TO PLAY WHEN OPENING WINDOW -->
        <!-- <nav>

        </nav> -->

    </main>
