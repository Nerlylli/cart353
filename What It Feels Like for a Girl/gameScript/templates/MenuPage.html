<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Page</title>
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/popup.css">
</head>

<body>
    <main class=" WIFLG">
        <div id="popup3" class="over_lay">
            <div>
                <div
                    style=" background: #ff69b4; border: 3px solid hotpink; box-shadow: 0 0 15px #fff, 0 0 25px #ff00ff, inset 0 0 10px #fff; width: 500px; padding: 30px; border-radius: 10px; text-align: center;  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-size: 20px">
                    GAMEPLAY INSTRUCTIONS
                    <div style="max-height: 100px;  margin-bottom: 20px; padding: 10px;border-radius: 5px;">
                        <p style="text-align: justify;">Click on your right and left keys to navigate the rooms.<br>
                            When wanting to change rooms, click on the door. <br>
                            Whenever a battle occurs, look for hints in order to win them.
                        </p>
                        <div>
                            <a class=" ok" href="MenuPage.html">OK</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="screen">
            <a href="desktop.html">
                <button class="play" style="position: absolute; z-index: 1;">PLAY</button>
            </a>

            <a href="#popup3">
                <button class="settings" style="position: absolute; z-index: 1;">GAMEPLAY</button>
            </a>
            <!-- <button class="exit" style="position: absolute; z-index: 1;">EXIT GAME</button> -->

            <!-- IMAGES -->
            <!-- left-corner -->
            <img src="../assets/images/story/glitter.png"
                style="height: 100vh;width: 600px; position: absolute; top: 0px; left: 0px;">
            <img src="../assets/images/story/sparkle.png" style="height:90vh;width: 550px;position: absolute;
            ">
            <!-- petals -->
            <img class="petal" src="../assets/images/story/petal1.png"
                style="position: absolute;height: 500px; width: 500px; top: -110px; right: -200px;">
            <img src="../assets/images/story/petal2.png" style="position: absolute;height: 400px;height:400px;
            top: -70px;left: 250px;">
            <img src="../assets/images/story/petal3.png"
                style="position: absolute;height: 155px;width: 155px;top: 70px;left: 370px;">
            <!-- bottom -->
            <img src=" ../assets/images/story/flower.png"
                style="height: 50vh;width: 100vw;transform: translate(0%, 102.25%);">
            <img class="unicorn" src="../assets/images/story/unicorn.png"
                style="height: 65%;width: 30%;position:absolute;left:50%; top: 30%; rotate: 15deg;">
        </section>

    </main>
